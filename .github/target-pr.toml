# Reduced build matrix for pull requests.
#
# The full .github/target.toml matrix, including mips/musl/cross builds,
# still runs on pushes to master and on release tags. Pull requests
# only need the platforms that catch most breakage, because the PR matrix
# accounts for most of the repository's Actions minutes.

[[target]]
os = "ubuntu-latest"
target = "x86_64-unknown-linux-gnu"
release-name = "x86_64-unknown-linux-gnu"
tool = "cross"
# Cronet's archives carry SHT_CREL (LLVM compact relocations), which the image's
# binutils 2.42 cannot read. x86_64-gnu already defaults to LLD since Rust 1.90,
# but musl and aarch64 still use gcc + GNU ld, so ask rustc for the LLD backend:
# it drives gcc's -fuse-ld=lld with its bundled ld.lld and crt still comes from gcc.
rustflags = "-Z unstable-options -C linker-features=+lld --cfg tokio_unstable"
extra-args = "-F plus,naive-static,naive-download"

[[target]]
os = "ubuntu-latest"
target = "x86_64-unknown-linux-musl"
release-name = "x86_64-unknown-linux-musl"
tool = "cross"
# Cronet's archives carry SHT_CREL (LLVM compact relocations), which the image's
# binutils 2.42 cannot read. x86_64-gnu already defaults to LLD since Rust 1.90,
# but musl and aarch64 still use gcc + GNU ld, so ask rustc for the LLD backend:
# it drives gcc's -fuse-ld=lld with its bundled ld.lld and crt still comes from gcc.
rustflags = "-Z unstable-options -C linker-features=+lld --cfg tokio_unstable"
extra-args = "-F perf,naive-static,naive-download"

[[target]]
os = "ubuntu-latest"
target = "aarch64-unknown-linux-gnu"
release-name = "aarch64-unknown-linux-gnu"
tool = "cross"
# Cronet's archives carry SHT_CREL (LLVM compact relocations), which the image's
# binutils 2.42 cannot read. x86_64-gnu already defaults to LLD since Rust 1.90,
# but musl and aarch64 still use gcc + GNU ld, so ask rustc for the LLD backend:
# it drives gcc's -fuse-ld=lld with its bundled ld.lld and crt still comes from gcc.
rustflags = "-Z unstable-options -C linker-features=+lld --cfg tokio_unstable"
extra-args = "-F plus,naive-static,naive-download"

[[target]]
os = "windows-latest"
target = "x86_64-pc-windows-msvc"
release-name = "x86_64-pc-windows-msvc"
postfix = ".exe"
extra-args = "-F plus,naive-static,naive-download"
nasm = true

[[target]]
os = "macos-latest"
target = "aarch64-apple-darwin"
release-name = "aarch64-apple-darwin"
extra-args = "-F plus,naive-static,naive-download"
