name: CI

on:
  push:
    tags: ["v*"]
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_LOG: "clash_lib=TRACE"
  RUST_TOOLCHAIN: "stable"
  RUSTC_BOOTSTRAP: "1"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build:
    name: Build
    uses: rust-proxy/workflows/.github/workflows/rust-build.yml@v2.0.4
    secrets:
      sentry-dsn: ${{ secrets.SENTRY_DSN }}
    with:
      rust-toolchain: "stable"
      packages: "clash-rs"
      target-config-file: ".github/target.toml"
      rustflags: ""
      enable-tmate: true
      enable-sccache: true
      only-clippy-tests-on-pr: true

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    needs: [build]
    uses: rust-proxy/workflows/.github/workflows/release-publish.yml@e6adb5658af3a7bf9df4d323a1de4e92ce600ee3 # main
    secrets:
      token: ${{ secrets.WATFAQ_RELEASE_PAT }}
    with:
      cliff-config: '.github/cliff.toml'
      create-latest-on-push: true
      target-repository: 'watfaq-legacy/clash-rs'

  docker:
    name: Docker
    needs: [build]
    uses: rust-proxy/workflows/.github/workflows/docker-publish.yml@v2.0.4
    with:
      docker-file: '.github/Dockerfile'
      image-name: 'clash-rs'
      platforms: 'linux/amd64,linux/arm64'
      binary-dir: './packages'
      server-binary-amd64: 'clash-rs-x86_64-unknown-linux-musl'
      server-binary-arm64: 'clash-rs-aarch64-unknown-linux-musl'