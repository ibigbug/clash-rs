# Android (no release)
[[target]]
os = "ubuntu-latest"
target = "x86_64-linux-android"
release-name = "x86_64-linux-android"
tool = "cross"
extra-args = "--no-default-features -F android,naive-static,naive-download"
skip-upload = true
skip-test = true